# FREEDJ STICK: the deck with its tracks on a USB stick in the FM-1's own port (fm1/usbmsc.c), through a powered,
# hub-less OTG adapter, or DVS: a USB audio interface there (a UCA202), a Serato record driving the deck, the
# tracks from the module's flash; needs fm1-dock 0.9.0 (it takes the port by writing that build's USB state: README); make fm1-stick
name = FREEDJ STICK
version = 1
sources = ../hal_fm1.c ../usbmsc.c ../../fw/timecode.c ../../fw/vinyl.c ../../build/fm1/memcard.c ../../fw/app.c ../../fw/ui.c ../../fw/sd.c ../../fw/tracks.c ../../fw/font.c ../../fw/pff/pff.c ../../lite/lite.c ../../lite/ulaw.c ../../sim/emu/sd_emu.c
includes = .. ../../fw ../../lite ../../sim/emu
cflags = -Os -mcpu=r3 -mfprev1 -ffp-contract=off -DHAL_AUDIO_BLOCKS=64 -DFM1_STICK=1 -DWAVE_DIV=2
